<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f171e" />
      <stop offset="100%" stop-color="#06090c" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5fdee7" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffeb3b" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Hexagonal Shield -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />
  
  <!-- Outer Glowing Cyber Ring -->
  <rect x="8" y="8" width="112" height="112" rx="24" fill="none" stroke="url(#cyanGrad)" stroke-width="3.5" filter="url(#glow)" />
  
  <!-- Inner Technical Grid Lines -->
  <path d="M24 64h80M64 24v80" stroke="#5fdee7" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4 4" />
  
  <!-- Upward Trajectory Arrow -->
  <path d="M82 46l18-2-2 18M98 44L68 74" fill="none" stroke="#5fdee7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Bold CB Monogram -->
  <text x="60" y="80" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-size="46" 
        font-weight="900" 
        letter-spacing="-2"
        fill="url(#goldGrad)" 
        text-anchor="middle"
        filter="drop-shadow(0 4px 6px rgba(0,0,0,0.8))">
    CB
  </text>
  
  <!-- Small Dot Accent -->
  <circle cx="92" cy="78" r="4" fill="#5fdee7" />
</svg>
