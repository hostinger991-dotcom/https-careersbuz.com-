<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Rounded Badge -->
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#badgeGrad)" stroke="#ffedd5" stroke-width="2" filter="url(#shadow)" />

  <!-- Briefcase Handle -->
  <path d="M46 36 C46 26 82 26 82 36" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round" />

  <!-- Briefcase Main Body -->
  <rect x="22" y="38" width="84" height="64" rx="14" fill="#ffffff" />

  <!-- Briefcase Top Flap Cutout -->
  <path d="M22 62 L64 74 L106 62" stroke="#ea580c" stroke-width="4" fill="none" stroke-linejoin="round" />

  <!-- Center Gold Lock Emblem -->
  <rect x="56" y="66" width="16" height="16" rx="4" fill="url(#goldGrad)" stroke="#d97706" stroke-width="1.5" />
  <circle cx="64" cy="73" r="2.5" fill="#78350f" />

  <!-- Upward Trend Arrow Accent in Bottom Right -->
  <circle cx="94" cy="94" r="18" fill="#10b981" stroke="#ffffff" stroke-width="3" />
  <path d="M88 98 L98 88 M98 88 L92 88 M98 88 L98 94" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
