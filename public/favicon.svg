<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient: Rich Terracotta to Deep Russet -->
    <linearGradient id="cbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#c2410c" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>

    <!-- Gold Accent Gradient for Upward Trajectory -->
    <linearGradient id="cbGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Subtle Drop Shadow for depth -->
    <filter id="cbShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#431407" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Modern App Icon Squircle Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#cbBg)" stroke="#fdba74" stroke-width="1.5" filter="url(#cbShadow)" />

  <!-- Inner Subtle Accent Ring -->
  <rect x="4.5" y="4.5" width="55" height="55" rx="13.5" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.25" />

  <!-- Iconic Monogram "C" (Careers) -->
  <path d="M 27 18 C 17.5 18 12 24.5 12 32 C 12 39.5 17.5 46 27 46 C 30.5 46 33.5 44.5 35 43 L 32.5 38.5 C 31 39.5 29 40.5 27 40.5 C 21.5 40.5 18 36.8 18 32 C 18 27.2 21.5 23.5 27 23.5 C 29 23.5 31 24.5 32.5 25.5 L 35 21 C 33.5 19.5 30.5 18 27 18 Z" fill="#ffffff" />

  <!-- Iconic Monogram "B" (Buz) with Embedded Career Upward Arrow -->
  <!-- Vertical Spine of B -->
  <rect x="36" y="18" width="5.5" height="28" rx="2" fill="#ffffff" />

  <!-- Upper Loop of B -->
  <path d="M 39 18 L 47 18 C 50.5 18 53 20 53 23.5 C 53 27 50.5 29 47 29 L 39 29 Z" fill="#ffffff" />
  <path d="M 41.5 22.5 L 46.5 22.5 C 47.8 22.5 48.8 23 48.8 24 C 48.8 25 47.8 25.5 46.5 25.5 L 41.5 25.5 Z" fill="#c2410c" />

  <!-- Lower Loop of B (Stylized Dynamic Career Forward Surge) -->
  <path d="M 39 28 L 48.5 28 C 52.5 28 55 30.5 55 35 C 55 39.5 52 42 47.5 42 L 39 42 Z" fill="#ffffff" />
  <path d="M 41.5 32 L 47 32 C 48.5 32 49.8 33 49.8 35 C 49.8 37 48.5 38 47 38 L 41.5 38 Z" fill="#c2410c" />

  <!-- Golden Upward Career Growth Spark / Arrow at Top Right -->
  <polygon points="50,11 58,11 58,19 55,16 48,23 45,20 52,13" fill="url(#cbGold)" stroke="#b45309" stroke-width="0.5" />
</svg>
